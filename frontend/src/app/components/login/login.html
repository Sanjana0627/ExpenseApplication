<div class="login-shell">
  <div class="login-container">
    <div class="login-brand">
      <img src="assets/images/veriparklogo.png" alt="VeriPark logo" weight="100">
    </div>

    <h2>Sign in to Expense Application</h2>

    <form (ngSubmit)="onSubmit()">
      <div>
        <label>Username</label>
        <input type="text" [(ngModel)]="username" name="username" placeholder="Enter your username" required autofocus />
      </div>
      <div>
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Enter your password" required />
      </div>
      <button type="submit">Log in</button>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>
  </div>
</div>
